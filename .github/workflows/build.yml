          if swift.is_file() and 'dm_pad_layout_set' not in text:
              raise SystemExit('Host UI check: control selection handler was not found in GameMenu.swift.')
          header = root / 'DmGameMenu.h'
          if swift.is_file() and header.is_file() and 'dm_quit_menu' in header.read_text(encoding='utf-8', errors='replace') and 'dm_quit_menu()' not in text:
              raise SystemExit('Host UI check: the engine Quit action was not preserved.')
          if not swift.is_file() and ('buildTopMenuElements' not in text or 'setPadLayoutMode' not in text):
              raise SystemExit('Host UI check: legacy control-menu handler was not found.')
          legacy = Path('dm/gfx/nvn/nvn_mtl_legacy.inc')
          if legacy.is_file():
              t = legacy.read_text(encoding='utf-8', errors='replace')
              if 'TONTON_SHADER_CHAIN' in t:
                  raise SystemExit('Patch check: legacy renderer still references TONTON_SHADER_CHAIN.')
              if 'g_ext_ev_val' in t:
                  declared = t.find('static _Atomic uint64_t g_ext_ev_val;')
                  present = t.find('static int present_now(')
                  if declared < 0 or present < 0 or declared > present:
                      raise SystemExit('Patch check: legacy renderer event declaration is missing or appears too late.')
          # Conservative source audit: literal Han characters in host UI source
          # or settings rows trigger review. Game text is not included.
          han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          checked = [p for p in root.rglob('*') if p.is_file() and p.suffix in {'.swift', '.m', '.mm', '.h'}]
          settings = Path('dm/games/settings.tsv')
          if settings.is_file(): checked.append(settings)
          for p in checked:
              if han.search(p.read_text(encoding='utf-8', errors='replace')):
                  raise SystemExit(f'Host UI source audit: Han character found in {p}. Review the source before building. Game text is not audited.')
          print(f'Host source checks passed: {len(checked)} files scanned; control labels and selected legacy patches checked.')
          print('These checks do not test compilation, runtime menu availability, touch accuracy, or game language.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Host source checks\n- Control labels and selected patch markers found; host UI sources scanned for literal Han characters.\n- Not a device test or a guarantee about game text, escaped strings, all resources, or touch behaviour.\n\n')
          PYTHON

      - name: Pre-build checks and summary
        env:
          DEVICE_INPUT: ${{ inputs.device }}
          MODE_INPUT: ${{ inputs.build_mode }}
          ROMFS_INPUT: ${{ inputs.romfs_mode }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          game_dir = root / 'GameFiles'
          exts = {'.nsp', '.xci', '.nsz', '.xcz', '.nup'}
          packages = sorted(p for p in game_dir.iterdir() if p.is_file() and p.suffix.lower() in exts)
          if not packages:
              raise SystemExit('No supported game packages were prepared. Check the download links and archive contents.')
          keys = root / 'nxnative' / 'prod.keys'
          if any(p.suffix.lower() != '.nup' for p in packages) and (not keys.is_file() or not keys.stat().st_size):
              raise SystemExit('prod.keys is required for NSP/XCI/NSZ/XCZ packages. Set the Keys_URL secret.')
          free = shutil.disk_usage(root).free
          total = sum(p.stat().st_size for p in packages)
          profile = os.environ.get('DM_GAME', 'DEFAULT')
          profile_dir = Path('dm/games') / profile
          if profile != 'DEFAULT' and not profile_dir.is_dir():
              raise SystemExit(f'Profile {profile!r} was selected but its directory was not found. Check the profile override.')
          version_tags = sorted({m.group(1) for p in packages for m in re.finditer(r'\[v(\d+)\]', p.name, re.I)})
          version_note = ', '.join('v' + v for v in version_tags) if version_tags else 'Not reliably detected'
          def clean(text):
              return str(text).replace('`', '').replace('\n', ' ').replace('\r', ' ')
          lines = [
              '## Pre-build checks',
              f"- Title ID: `{clean(os.environ.get('DETECTED_TITLE_ID', 'unknown'))}`",
              f"- Profile: `{clean(profile)}`" + (' (fallback; game compatibility is not guaranteed)' if profile == 'DEFAULT' else ' (profile present; compatibility is not guaranteed)'),
              f"- Engine selection: {clean(os.environ.get('DEVICE_INPUT', 'unknown'))}",
              f"- Repository commit: `{clean(os.environ.get('ENGINE_REV', 'unknown'))}`",
              f"- Workflow revision: `{clean(os.environ.get('WORKFLOW_REV', 'unknown'))}`",
              f"- Prepared packages: {len(packages)}, {total / 1e9:.2f} GB total; filename version tags: {version_note} (not verified)",
              f"- Runner free space: {free / 1e9:.2f} GB at this point; extraction and shaders need additional space.",
              f"- Mode: {clean(os.environ.get('MODE_INPUT', 'unknown'))}; RomFS: {clean(os.environ.get('ROMFS_INPUT', 'unknown'))}",
              f"- Shared shader cache: {'opted in' if os.environ.get('CACHE_INPUT') == 'true' else 'off'}",
          ]
          if os.environ.get('NX2_UPSTREAM_PIN'):
              lines.append(f"- NX2Apple upstream pin: `{clean(os.environ['NX2_UPSTREAM_PIN'])}`; synced engine commit: `{clean(os.environ.get('NX2_ENGINE_REV', 'unknown'))}`")
          if free < 20 * 10**9:
              lines.append('- **Warning:** Less than 20 GB is free. Large games may need much more; this is an advisory, not a space guarantee.')
              print('::warning::Less than 20 GB free; large games can need substantially more space.')
          if profile == 'DEFAULT':
              print('::warning::No matching game profile selected. A fallback profile does not establish game compatibility.')
          if os.environ.get('CACHE_INPUT') == 'true':
              lines.append('- **Cache notice:** Game-derived shader data may be accessible to readers of a public repository. Never cache keys or complete game files.')
          lines += [
              '- **Sharing warning:** The IPA is uploaded as a GitHub artifact and, unless disabled, to a public GoFile link. A bundled IPA can contain game files; anyone with access to those outputs may obtain them.',
              '- Use repository secrets for private input links. Workflow-dispatch inputs may be visible to people who can view the run; log masking is not a security boundary.',
              '- To skip GoFile, set the repository Actions variable `GOFILE_UPLOAD` to `false` before dispatching. The GitHub artifact is still uploaded.',
          ]
          lines.append('')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          print('Pre-build checks complete. Package and version checks are not proof of compatibility.')
          PY

      - name: Run fast 2-minute compatibility survey (Survey Only mode)
        if: inputs.build_mode == 'Survey Only (Fast 2-min compatibility check)'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          KEYS_ARGS=()
          if [[ -s "$WORK/prod.keys" ]]; then
            KEYS_ARGS=(-k "$WORK/prod.keys")
          fi

          SURVEY_ARGS=(--survey-only)
          if python scripts/build_ipa_from_nsp.py --help 2>&1 | grep -q -- "--provisional"; then
            SURVEY_ARGS+=(--provisional)
          fi

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            "${KEYS_ARGS[@]}" \
            "${SURVEY_ARGS[@]}"

          {
            echo "## 🔍 Compatibility Survey Report (\`$DETECTED_TITLE_ID\`)"
            if [[ -f "dm/games/$DETECTED_TITLE_ID/README.md" ]]; then
              echo "✅ **Official Profile Status:** Supported in \`dm/games/$DETECTED_TITLE_ID\`!"
              echo ""
              echo "<details><summary><b>View Official Profile Notes</b></summary>"
              echo ""
              cat "dm/games/$DETECTED_TITLE_ID/README.md"
              echo ""
              echo "</details>"
              echo ""
            else
              echo "ℹ️ **Official Profile Status:** No official profile yet (uses automatic provisional profile)."
              echo ""
            fi
            SURVEY_FILE="$(find "$GAME_DIR" -name "survey.md" -type f -print -quit)"
            if [[ -n "$SURVEY_FILE" && -f "$SURVEY_FILE" ]]; then
              cat "$SURVEY_FILE"
            else
              echo "_Survey completed (see job logs for details)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update shader toolchain lock and header
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          CACHE_DEVICE: ${{ inputs.device }}
          CACHE_ROMFS: ${{ inputs.romfs_mode }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
          LOCK_SCRIPT="$(
            find . -name tool_lock.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          if [[ -n "$LOCK_SCRIPT" ]]; then
            python "$LOCK_SCRIPT" --update-lock
          else
            python "$CHAIN_SCRIPT" --update-lock
          fi

          python "$CHAIN_SCRIPT" --header
          CHAIN_ID="$(python - <<'PY'
          import re
          from pathlib import Path
          p = Path('dm/gfx/nvn/dmsh_chain.h')
          text = p.read_text(encoding='utf-8', errors='replace') if p.is_file() else ''
          m = re.search(r'#define\s+DMSH_CHAIN\s+"([A-Za-z0-9._-]+)"', text)
          print(m.group(1) if m else 'not detected')
          PY
          )"
          echo "SHADER_CHAIN_ID=$CHAIN_ID" >> "$GITHUB_ENV"
          echo "- Generated source shader chain: \`$CHAIN_ID\`" >> "$GITHUB_STEP_SUMMARY"

          # Normalize dmsh_xlate_bin timestamps so shader cache keys stay identical across runners
          if [[ -d "dm/gfx/tools/dmsh_xlate_bin" ]]; then
            find dm/gfx/tools/dmsh_xlate_bin -exec touch -t 202601010000.00 {} +
          fi

          # Cache only by an exact fingerprint; never use broad restore keys.
          # Hash all prepared package bytes (base/update/DLC), patched engine sources,
          # selected device, workflow revision and the installed Apple toolchain.
          if [[ "${{ inputs.shader_cache }}" == "true" ]]; then
            SHADER_HASH="$(python - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          h = hashlib.sha256()
          def add(name, data):
              n = name.encode(); h.update(len(n).to_bytes(8, 'big')); h.update(n)
              h.update(len(data).to_bytes(8, 'big')); h.update(data)
          def file_hash(path, label):
              fhash = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(4 * 1024 * 1024), b''):
                      fhash.update(chunk)
              add(label, fhash.digest())
          for key in ('ENGINE_REV', 'WORKFLOW_REV', 'NX2_UPSTREAM_PIN', 'DETECTED_TITLE_ID', 'DM_GAME'):
              add(key, os.environ.get(key, '').encode())
          add('device', os.environ['CACHE_DEVICE'].encode())
          add('romfs_mode', os.environ['CACHE_ROMFS'].encode())
          for command in (['xcodebuild', '-version'], ['xcrun', '--sdk', 'iphoneos', '--show-sdk-version'], ['xcrun', '-sdk', 'iphoneos', 'metal', '--version'], ['python', '--version'], ['python', '-m', 'pip', 'freeze'], ['dotnet', '--version'], ['glslangValidator', '--version'], ['spirv-cross', '--version'], ['zstd', '--version']):
              try:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False)
                  add(' '.join(command), str(result.returncode).encode() + b'\n' + result.stdout)
              except FileNotFoundError:
                  add(' '.join(command), b'not installed')
          for root in (Path('dm'), Path('scripts'), Path('tools'), Path('ref'), Path('patches')):
              if not root.is_dir():
                  continue
              for p in sorted(root.rglob('*')):
                  if any(x in {'.git', '__pycache__', '.DS_Store'} for x in p.parts):
                      continue
                  if p.is_file():
                      file_hash(p, str(p))
          game_dir = Path(os.environ['RUNNER_TEMP']) / 'GameFiles'
          packages = sorted(p for p in game_dir.iterdir() if p.is_file() and p.suffix.lower() in {'.nsp', '.xci', '.nsz', '.xcz', '.nup'})
          if not packages:
              raise SystemExit('Cannot fingerprint shader cache without game packages')
          for p in packages:
              file_hash(p, 'package/' + p.name)
          print(h.hexdigest())
          PY
            )"
            echo "SHADER_CACHE_HASH=$SHADER_HASH" >> "$GITHUB_ENV"
          fi

      - name: Restore compiled iOS shader cache (exact match only)
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && inputs.shader_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nxnative-shader-cache
          key: nxnative-shaders-v2-${{ env.SHADER_CACHE_HASH }}

      - name: Build unsigned IPA
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_MODE_INPUT: ${{ inputs.romfs_mode }}
          LANG_INPUT: ${{ inputs.language }}
          SHOW_FPS_INPUT: ${{ inputs.show_fps }}
          DEVICE_INPUT: ${{ inputs.device }}
          CACHE_INPUT: ${{ inputs.shader_cache }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          BUILD_DIR="$GAME_DIR/${DETECTED_TITLE_ID}_build"
          SHADER_CACHE="$RUNNER_TEMP/nxnative-shader-cache"

          if [[ "$CACHE_INPUT" == "true" && -d "$SHADER_CACHE/shader" ]]; then
            echo "Restoring exact-match cached iOS shaders for $DETECTED_TITLE_ID..."
            mkdir -p "$BUILD_DIR"
            cp -a "$SHADER_CACHE/shader" "$BUILD_DIR/shader"
          fi

          HELP_TEXT="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"

          BUILD_ARGS=("$GAME_DIR" -o "$OUTPUT")
          if [[ -s "$WORK/prod.keys" ]]; then
            BUILD_ARGS+=(-k "$WORK/prod.keys")
          fi

          # Device-specific renderer & pipeline archive settings
          if [[ "$DEVICE_INPUT" == *"BC fallback"* ]]; then
            export DM_IOS_RENDERER=legacy
            export DM_LEGACY_TARGET=m2
            if grep -q -- "--gpu" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--gpu none)
            fi
          elif grep -q -- "--gpu" <<<"$HELP_TEXT"; then
            # Pre-compile Metal 4 pipeline archive for A19 Pro (g18p) on iPhone 17 Pro builds
            BUILD_ARGS+=(--gpu g18p)
          fi

          # RomFS mode: bundle (full all-in-one IPA, delete extracted files after packing)
          # or separate (IPA without bundled RomFS; size varies by game)
          if [[ "$ROMFS_MODE_INPUT" == separate* ]]; then
            export DM_COPY_ROMFS=NO
            if grep -q -- "--romfs" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--romfs separate)
            fi
          else
            export DM_FULL_ROMFS=1
            export DM_COPY_ROMFS=YES
            if grep -q -- "--no-keep-extracted" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--no-keep-extracted)
            fi
          fi

          # Optional default game language (unlocked in Start Screen)
          if [[ -n "${LANG_INPUT// /}" ]]; then
            BUILD_ARGS+=(-l "${LANG_INPUT// /}")
          fi

          # Default FPS counter toggle (unlocked in Start Screen)
          if [[ "$SHOW_FPS_INPUT" == "false" ]] && grep -q -- "--no-show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--no-show-fps)
          elif grep -q -- "--show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--show-fps)
          fi

          python scripts/build_ipa_from_nsp.py "${BUILD_ARGS[@]}"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          if [[ "$CACHE_INPUT" == "true" && -d "$BUILD_DIR/shader" ]]; then
            echo "Staging compiled iOS shaders for the opted-in GitHub Actions cache..."
            rm -rf "$SHADER_CACHE"
            mkdir -p "$SHADER_CACHE/shader"
            python - "$BUILD_DIR/shader" "$SHADER_CACHE/shader" <<'PYTHON'
          import shutil, sys
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          blocked = {'prod.keys', 'keys.txt', 'env.txt'}
          def copy(src, dst):
              if src.is_symlink() or src.name.lower() in blocked or src.suffix.lower() in {'.p12', '.pfx'}:
                  print('Skipping a symlink or credential-like cache entry.')
              elif src.is_dir():
                  dst.mkdir(parents=True, exist_ok=True)
                  for child in src.iterdir(): copy(child, dst / child.name)
              elif src.is_file():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          for name in ('ios', 'cache', 'pso_pairs.tsv'):
              copy(src / name, dst / name)
          PYTHON
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Report IPA identity, size, hash and RomFS requirements
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_INPUT: ${{ inputs.romfs_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, plistlib, re, zipfile
          from pathlib import Path
          ipa = Path(os.environ['RUNNER_TEMP']) / os.environ['IPA_FILENAME']
          sha = hashlib.sha256()
          with ipa.open('rb') as f:
              for block in iter(lambda: f.read(4 * 1024 * 1024), b''):
                  sha.update(block)
          lines = ['## Built IPA', f'- File: `{ipa.name}`', f'- Size: {ipa.stat().st_size:,} bytes ({ipa.stat().st_size / 1e9:.2f} GB)', f'- SHA-256: `{sha.hexdigest()}`']
          try:
              with zipfile.ZipFile(ipa) as z:
                  prohibited = {'prod.keys', 'keys.txt'}
                  sensitive = [i.filename for i in z.infolist() if Path(i.filename).name.lower() in prohibited or Path(i.filename).suffix.lower() in {'.p12', '.pfx'}]
                  if sensitive:
                      raise SystemExit('IPA contains a file with a credential-like name. Publishing stopped; inspect the IPA locally before sharing.')
                  infos = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', i.filename) and i.file_size <= 1024 * 1024]
                  if len(infos) == 1:
                      info = plistlib.loads(z.read(infos[0]))
                      for key, label in [('CFBundleIdentifier', 'Bundle ID'), ('MinimumOSVersion', 'Minimum iOS'), ('DMCommit', 'IPA-reported engine commit'), ('DMChain', 'IPA-reported shader chain')]:
                          v = info.get(key)
                          if isinstance(v, (str, int, float)):
                              lines.append(f'- {label}: `{str(v).replace("`", "").replace(chr(10), " ").replace(chr(13), " ")}`')
                  # Decode the generated host settings, including JSON-escaped characters.
                  # This is a targeted audit, not a full game or runtime UI inspection.
                  han = re.compile(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
                  for entry in z.infolist():
                      if re.fullmatch(r'Payload/[^/]+\.app/dm/(?:p\d+/)?launcher\.json', entry.filename) and entry.file_size <= 2_000_000:
                          try:
                              settings = json.loads(z.read(entry).decode('utf-8'))
                          except (ValueError, UnicodeError):
                              raise SystemExit('Could not read generated launcher settings for the English UI audit; publishing stopped.')
                          if han.search(json.dumps(settings, ensure_ascii=False)):
                              raise SystemExit('Generated host launcher settings contain Han characters; publishing stopped for review. Game UI was not audited.')
                  names = [i.filename for i in z.infolist()]
                  bundled = any(re.match(r'Payload/[^/]+\.app/romfs(?:/|\.img$)', name, re.I) for name in names)
                  lines.append('- IPA contains a conventional bundled RomFS path.' if bundled else '- No conventional bundled RomFS path was found in the IPA (this is not a complete content audit).')
                  ids = [i for i in z.infolist() if re.fullmatch(r'Payload/[^/]+\.app/romfs\.id', i.filename, re.I) and i.file_size <= 4096]
                  if len(ids) == 1:
                      identity = z.read(ids[0]).decode('utf-8', 'replace').strip().replace('`', '').replace('\n', ' ').replace('\r', ' ')
                      lines.append(f'- RomFS identity recorded in IPA: `{identity}`')
                  elif os.environ.get('ROMFS_INPUT', '').startswith('separate'):
                      lines.append('- No unique RomFS identity was found in the IPA; check the engine build logs for requirements.')
          except (zipfile.BadZipFile, OSError, ValueError, plistlib.InvalidFileException) as e:
              raise SystemExit(f'Could not inspect IPA metadata ({type(e).__name__}); publishing stopped. Check the build logs.')
          if os.environ.get('ROMFS_INPUT', '').startswith('separate'):
              lines += ['- Separate mode was requested. Obtain a compatible image from your own game; this workflow does not upload a separate RomFS.', '- For engines supporting it, place the matching image as `romfs.img` in the app’s Documents folder. Check the engine’s instructions and your sideloader’s file location.']
          else:
              lines.append('- Bundle mode was requested; check build logs if the selected engine uses different packaging rules.')
          lines.append('')
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text)
          PY

      - name: Publish GoFile download page
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && vars.GOFILE_UPLOAD != 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          echo "::warning::GoFile creates a public share link. A bundled IPA can include game files."
          echo "Uploading to GoFile; if the Singapore endpoint fails, the global endpoint is tried."
          DOWNLOAD_URL=""
          for endpoint in https://upload-ap-sgp.gofile.io/uploadfile https://upload.gofile.io/uploadfile; do
            response_file="$(mktemp "$RUNNER_TEMP/gofile-response.XXXXXX")"
            chmod 600 "$response_file"
            if curl -fsS --retry 2 --connect-timeout 30 --max-time 3600 -F "file=@$OUTPUT" -o "$response_file" "$endpoint" 2>/dev/null; then
              DOWNLOAD_URL="$(python - "$response_file" <<'PYTHON'
          import json, re, sys
          from urllib.parse import urlsplit
          try:
              with open(sys.argv[1], encoding='utf-8') as f: data = json.load(f)
              url = data.get('data', {}).get('downloadPage', '') if data.get('status') == 'ok' else ''
              parts = urlsplit(url)
              if parts.scheme == 'https' and parts.netloc == 'gofile.io' and re.fullmatch(r'/d/[A-Za-z0-9_-]{4,}', parts.path) and not parts.query and not parts.fragment:
                  print(url)
          except (OSError, ValueError, TypeError, AttributeError):
              pass
          PYTHON
              )"
            fi
            rm -f "$response_file"
            [[ -n "$DOWNLOAD_URL" ]] && break
            echo "GoFile endpoint did not return a valid download page; trying the next endpoint if available."
          done
          if [[ -n "$DOWNLOAD_URL" ]]; then
            echo "GoFile download page: $DOWNLOAD_URL"
            {
              echo "## GoFile download page"
              echo "- [Open the IPA download page]($DOWNLOAD_URL)"
              echo "- This is a GoFile page, not a guaranteed direct file URL. Availability and access depend on GoFile."
              echo "- The link is public; a bundled IPA can contain game files. Check the SHA-256 shown above after downloading."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GoFile upload failed; check the GitHub artifact fallback."
            echo "GoFile upload failed. Check the GitHub artifact fallback below." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload IPA
        id: ipa_artifact
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ runner.temp }}/${{ env.IPA_FILENAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Report IPA artifact fallback
        if: always() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)' && steps.ipa_artifact.outcome != 'skipped'
        env:
          ARTIFACT_OUTCOME: ${{ steps.ipa_artifact.outcome }}
          ARTIFACT_URL: ${{ steps.ipa_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          if [[ "$ARTIFACT_OUTCOME" == "success" && -n "$ARTIFACT_URL" ]]; then
            echo "## GitHub artifact fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download the IPA artifact]($ARTIFACT_URL) (GitHub provides a ZIP and requires appropriate access)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::IPA artifact upload failed. Check its step log."
            echo "IPA artifact upload failed; check the upload step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare redacted build logs
        if: always()
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          INPUT_DLC_URL: ${{ inputs.dlc_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          SECRET_DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import os, re
          from pathlib import Path
          from urllib.parse import parse_qsl, unquote, urlsplit
          root = Path(os.environ['RUNNER_TEMP'])
          game = root / 'GameFiles'
          out = root / 'nxnative-redacted-logs'
          out.mkdir(parents=True, exist_ok=True)
          sensitive = set()
          for name in ('INPUT_GAME_URL', 'INPUT_UPDATE_URL', 'INPUT_DLC_URL', 'SECRET_GAME_URL', 'SECRET_UPDATE_URL', 'SECRET_DLC_URL', 'KEYS_URL'):
              value = os.environ.get(name, '').strip()
              for token in re.split(r'[\s,;]+', value):
                  if len(token) >= 6:
                      sensitive.add(token)
                      sensitive.add(unquote(token))
                      try:
                          parts = urlsplit(token)
                      except ValueError:
                          continue
                      for _, val in parse_qsl(parts.query):
                          if len(val) >= 6: sensitive.add(val)
                      for part in parts.path.split('/'):
                          if re.fullmatch(r'[-A-Za-z0-9_]{20,}', part): sensitive.add(part)
          keyfile = root / 'nxnative' / 'prod.keys'
          key_names = set()
          if keyfile.is_file() and keyfile.stat().st_size <= 2_000_000:
              for line in keyfile.read_text(encoding='utf-8', errors='replace').splitlines():
                  if '=' in line:
                      name, value = line.split('=', 1)
                      if re.fullmatch(r'[A-Za-z0-9_]+', name.strip()): key_names.add(name.strip())
                      value = value.strip()
                      if len(value) >= 6: sensitive.add(value)
                      sensitive.update(re.findall(r'(?i)\b[0-9a-f]{16,}\b', value))
          values = sorted((s for s in sensitive if len(s) >= 6), key=len, reverse=True)
          key_pattern = re.compile(r'(?<![A-Za-z0-9_])(?:' + '|'.join(re.escape(k) for k in key_names) + r')(?![A-Za-z0-9_])', re.I) if key_names else None
          count = 0
          if game.is_dir():
              for folder in list(game.glob('*_build/logs')) + list(game.glob('*_survey')):
                  if not folder.is_dir() or folder.is_symlink(): continue
                  for p in folder.rglob('*'):
                      if not p.is_file() or p.is_symlink() or p.suffix.lower() not in {'.log', '.txt', '.md'} or p.stat().st_size > 25_000_000:
                          continue
                      text = p.read_text(encoding='utf-8', errors='replace')
                      for value in values: text = text.replace(value, '[REDACTED]')
                      text = re.sub(r'https?://[^\s<>"\']+', '[REDACTED URL]', text, flags=re.I)
                      if key_pattern:
                          text = '\n'.join('[REDACTED KEY LINE]' if key_pattern.search(line) else line for line in text.split('\n'))
                      # Avoid copying original paths or filenames, which may themselves
                      # contain private links, account names or other sensitive data.
                      label = 'build_ipa' if p.name == 'build_ipa.log' else 'log'
                      target = out / f'{count + 1:03d}-{label}{p.suffix.lower()}'
                      target.write_text(text, encoding='utf-8')
                      count += 1
          print(f'Prepared {count} text log(s) with best-effort redaction; binary and oversized files were skipped.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\nBuild-log artifacts use best-effort redaction. Review them before sharing; no automatic redactor can guarantee removal of all sensitive data.\n')
          PYTHON

      - name: Upload redacted build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: ${{ runner.temp }}/nxnative-redacted-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report failure troubleshooting
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build troubleshooting"
            echo "Open the failed step in this run for its error message."
            echo "If available, download the NxNative-Build-Logs artifact for the detailed build log."
            echo "Do not share prod.keys, private links, game files or unredacted sensitive logs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles" \
            "$RUNNER_TEMP/nxnative-redacted-logs"
