name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and engine version"
        required: true
        type: choice
        default: "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
        options:
          - "iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
          - "iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)"
      build_mode:
        description: "Build full IPA or run a fast 2-minute compatibility survey"
        required: true
        type: choice
        default: "Build IPA (Default)"
        options:
          - "Build IPA (Default)"
          - "Survey Only (Fast 2-min compatibility check)"
      romfs_mode:
        description: "Bundle game files inside IPA or build a tiny separate-RomFS update IPA"
        required: true
        type: choice
        default: "bundle (Full all-in-one IPA - Default)"
        options:
          - "bundle (Full all-in-one IPA - Default)"
          - "separate (Tiny ~100 MB update IPA without RomFS)"
      game_url:
        description: "Base Game (.nsp/.xci/.nsz/.xcz/.nup) Google Drive or direct HTTP link (blank = Game_URL secret)"
        required: false
        type: string
        default: ""
      update_url:
        description: "Update Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      dlc_url:
        description: "DLC Google Drive or direct HTTP link (optional; leave blank if none)"
        required: false
        type: string
        default: ""
      language:
        description: "Default game language (optional, e.g. en-US, ja, fr, es, zh-Hans; unlocked in Start Screen)"
        required: false
        type: string
        default: ""
      show_fps:
        description: "Enable FPS counter by default on Start Screen (stays unlocked in menu)"
        required: false
        type: boolean
        default: true
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 / iOS 27 SDK: nxnative main uses CMMotionManager.deviceMotionBody
    # (iOS 27); the macos-26 image tops out at Xcode 26.x and cannot compile it
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Free up runner disk space for large games
        shell: bash
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/android-sdk \
            /usr/local/lib/android \
            "$HOME/Library/Android" \
            "$HOME/.ghcup" \
            "$HOME/.rustup" \
            "$HOME/.cargo" \
            "$HOME/.gradle" \
            "$HOME/.m2" 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Checkout NX2Apple patched engine (Default)
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        uses: actions/checkout@v4
        with:
          repository: LNPANDY/NX2Apple
          ref: main

      - name: Checkout standard nxnative version
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer (standard)'
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: main

      - name: Checkout Metal 3 + BC fallback version (2020 iPad Pro / iPhone 15 or older)
        if: inputs.device == 'iPad (2020 A12Z) / iPhone 15 or older (Metal 3 + BC fallback)'
        uses: actions/checkout@v4
        with:
          repository: widmonstertony/nxnative
          ref: ios16-ios17-compat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync NX2Apple engine patches
        if: inputs.device == 'iPhone 15 Pro/Pro Max or newer - NX2Apple Patched (Default)'
        shell: bash
        run: |
          set -euo pipefail
          python tools/engine.py sync
          for dir in dm scripts docs ref; do
            if [[ -e "engine/$dir" ]]; then
              rm -rf "$dir"
              cp -a "engine/$dir" "$dir"
            fi
          done
          rm -rf engine

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar glslang
          python -m pip install -q \
            lz4 "capstone>=5,<6" fonttools backports.zstd gdown nsz zbic

          # Xcode 26/27 runners ship the Metal shader compiler
          # as a separate on-demand component; the build script requires
          # `xcrun -sdk iphoneos metal` to work.
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal toolchain not installed; downloading it..."
            xcodebuild -runFirstLaunch || true
            xcodebuild -downloadComponent MetalToolchain \
              || sudo xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk iphoneos metal --version | head -1

      - name: Download game files and keys
        env:
          INPUT_GAME_URL: ${{ inputs.game_url }}
          INPUT_UPDATE_URL: ${{ inputs.update_url }}
          INPUT_DLC_URL: ${{ inputs.dlc_url }}
          SECRET_GAME_URL: ${{ secrets.Game_URL }}
          SECRET_UPDATE_URL: ${{ secrets.Update_URL }}
          SECRET_DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          # If game_url is provided in the "Run workflow" popup, use the popup
          # inputs for game/update/dlc so old Update_URL or DLC_URL secrets from
          # a previous game do not get mixed in. Otherwise fall back to secrets.
          if [[ -n "${INPUT_GAME_URL// /}" ]]; then
            echo "Using game links from Run workflow popup inputs."
            GAME_URL="$INPUT_GAME_URL"
            UPDATE_URL="${INPUT_UPDATE_URL:-}"
            DLC_URL="${INPUT_DLC_URL:-}"
          else
            echo "Using game links from repository secrets."
            GAME_URL="${SECRET_GAME_URL:-}"
            UPDATE_URL="${INPUT_UPDATE_URL:-${SECRET_UPDATE_URL:-}}"
            DLC_URL="${INPUT_DLC_URL:-${SECRET_DLC_URL:-}}"
          fi

          download_file() {
            local url="$1"
            local output="$2"
            local parsed_items item kind target_id

            if [[ -z "${url// /}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            echo "::add-mask::$url"

            parsed_items="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          raw = sys.argv[1].strip()
          tokens = [t.strip() for t in re.split(r"[\s,;]+", raw) if t.strip()]
          results = []

          for token in tokens:
              parsed = urlparse(token)
              query = parse_qs(parsed.query)
              file_id = None
              kind = "file"

              if "google.com" in parsed.netloc.lower():
                  folder_match = re.search(r"/folders/([^/?#]+)", parsed.path)
                  file_match = re.search(r"/(?:file/d|d)/([^/?#]+)", parsed.path)
                  if folder_match:
                      file_id = folder_match.group(1)
                      kind = "folder"
                  elif file_match:
                      file_id = file_match.group(1)
                  elif query.get("id"):
                      file_id = query["id"][0]

              if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", token):
                  file_id = token

              if file_id:
                  results.append(f"{kind}:{file_id}:{token}")
              elif parsed.scheme.lower() in ("http", "https"):
                  # Direct HTTP/HTTPS URL (Pixeldrain, HuggingFace, Gofile direct, etc.)
                  results.append(f"direct:{token}:{token}")

          if not results:
              raise SystemExit(
                  "Could not extract a Google Drive ID or direct HTTP/HTTPS URL."
              )

          print("\n".join(results))
          PY
          )"

            while IFS= read -r item; do
              [[ -z "$item" ]] && continue
              kind="${item%%:*}"
              local rest="${item#*:}"
              target_id="${rest%%:*}"
              local raw_token="${rest#*:}"
              echo "::add-mask::$target_id"
              echo "::add-mask::$raw_token"
            done <<< "$parsed_items"

            (
              local gdown_home="$WORK/gdown_home_$(basename "$output")"
              mkdir -p "$gdown_home"
              local idx=0
              while IFS= read -r item; do
                [[ -z "$item" ]] && continue
                idx=$((idx + 1))
                kind="${item%%:*}"
                local rest="${item#*:}"
                if [[ "$kind" == "direct" ]]; then
                  target_id="$rest"
                else
                  target_id="${rest%%:*}"
                fi
                echo "Downloading $(basename "$output") item #$idx ($kind)..."
                if [[ "$kind" == "folder" ]]; then
                  mkdir -p "$output"
                  HOME="$gdown_home" gdown --folder "$target_id" -O "$output"
                  if [[ ! -d "$output" ]] || [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded Google Drive folder is empty."
                    exit 1
                  fi
                elif [[ "$(basename "$output")" == "prod.keys" ]]; then
                  if [[ "$kind" == "direct" ]]; then
                    curl -fL --retry 3 -o "$output" "$target_id"
                  else
                    HOME="$gdown_home" gdown "$target_id" -O "$output"
                  fi
                  if [[ ! -s "$output" ]]; then
                    echo "::error::Downloaded prod.keys file is empty."
                    exit 1
                  fi
                elif [[ "$kind" == "direct" ]]; then
                  mkdir -p "$output"
                  (
                    cd "$output"
                    curl -fL --retry 3 -O -J "$target_id"
                  )
                  if [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded direct URL directory is empty."
                    exit 1
                  fi
                else
                  # Download into a directory (-O "$output/") so gdown preserves the
                  # original Google Drive filename (including [TitleID] and [vVersion]
                  # tags required by standard-crypto / ticketless NSPs and updates).
                  mkdir -p "$output"
                  HOME="$gdown_home" gdown "$target_id" -O "$output/"
                  if [[ -z "$(ls -A "$output" 2>/dev/null)" ]]; then
                    echo "::error::Downloaded file directory is empty."
                    exit 1
                  fi
                fi
              done <<< "$parsed_items"
              echo "Finished downloading $(basename "$output")."
            ) &
            DOWNLOAD_PIDS+=("$!")
          }

          DOWNLOAD_PIDS=()
          download_file "$GAME_URL" "$WORK/game.download"

          if [[ -n "${KEYS_URL// /}" ]]; then
            download_file "$KEYS_URL" "$WORK/prod.keys"
          else
            echo "No KEYS_URL configured (only Switch 2 .nup packages can build without prod.keys)."
          fi

          if [[ -n "${UPDATE_URL// /}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL// /}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          for pid in "${DOWNLOAD_PIDS[@]}"; do
            wait "$pid"
          done

          if [[ -f "$WORK/prod.keys" ]]; then
            chmod 600 "$WORK/prod.keys"
          fi

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import struct
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          keys_path = work / "prod.keys"
          package_extensions = {
              ".nsp", ".xci", ".nsz", ".xcz", ".nup"
          }
          archive_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
              b"PK\x03\x04",
              b"7z\xbc\xaf\x27\x1c",
          )

          def pfs0_entries(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)
                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []
                      count, string_size = struct.unpack_from("<II", header, 4)
                      if count > 100000 or string_size > 100000000:
                          return []
                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)
                      if len(entries) != count * 0x18:
                          return []
                      names = []
                      for i in range(count):
                          offset = struct.unpack_from("<I", entries, i * 0x18 + 0x10)[0]
                          if offset >= len(strings):
                              continue
                          end = strings.find(b"\0", offset)
                          if end < 0:
                              continue
                          names.append(strings[offset:end].decode(errors="replace"))
                      return names
              except (OSError, struct.error):
                  return []

          def detect_package_extension(path):
              with path.open("rb") as f:
                  header = f.read(0x104)
              if header[:4] == b"NUP\x01":
                  return ".nup"
              if header[:4] == b"PFS0":
                  names = [n.lower() for n in pfs0_entries(path)]
                  if any(n.endswith(".ncz") for n in names):
                      return ".nsz"
                  return ".nsp"
              if len(header) >= 0x104 and header[0x100:0x104] == b"HEAD":
                  if path.suffix.lower() == ".xcz":
                      return ".xcz"
                  return ".xci"
              return None

          def validate_package(path):
              with path.open("rb") as f:
                  header = f.read(0x104)

              suffix = path.suffix.lower()

              if suffix == ".nup" and header[:4] != b"NUP\x01":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".nsp", ".nsz") and header[:4] != b"PFS0":
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

              if suffix in (".xci", ".xcz") and (
                  len(header) < 0x104 or header[0x100:0x104] != b"HEAD"
              ):
                  raise SystemExit(
                      f"Invalid {suffix} package signature: {path.name}"
                  )

          def add_package(source, label):
              target = game_dir / source.name

              if target.exists():
                  if target.stat().st_size == source.stat().st_size:
                      print(
                          f"Skipping duplicate package ({label}): {target.name} "
                          f"({target.stat().st_size:,} bytes)"
                      )
                      return
                  target = game_dir / f"{label}_{source.name}"

              validate_package(source)
              shutil.move(str(source), str(target))

              print(
                  f"Added {label}: {target.name} "
                  f"({target.stat().st_size:,} bytes)"
              )

          def extract_and_add(archive_path, label):
              extract_dir = work / f"extracted-{label}-{archive_path.stem}"
              extract_dir.mkdir(parents=True, exist_ok=True)
              print(f"{label}: archive detected ({archive_path.name}); extracting.")
              subprocess.run(
                  ["unar", "-o", str(extract_dir), str(archive_path)],
                  check=True,
              )
              # Free archive disk space immediately after extraction
              archive_path.unlink(missing_ok=True)
              found = False
              for p in sorted(extract_dir.rglob("*")):
                  if not p.is_file() or p.name.startswith("._") or "__MACOSX" in p.parts:
                      continue
                  if p.suffix.lower() in package_extensions:
                      add_package(p, label)
                      found = True
                  else:
                      ext = detect_package_extension(p)
                      if ext:
                          renamed = p.with_name(f"{p.name}{ext}")
                          p.rename(renamed)
                          add_package(renamed, label)
                          found = True
              shutil.rmtree(extract_dir, ignore_errors=True)
              if not found:
                  raise SystemExit(
                      f"No NSP/XCI/NSZ/XCZ/NUP packages found in {label} archive."
                  )

          def process_download(label):
              source = work / f"{label}.download"

              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return

              if source.is_dir():
                  print(f"{label}: scanning downloaded files.")
                  found_any = False
                  for item in sorted(source.rglob("*")):
                      if not item.is_file() or item.name.startswith("._") or "__MACOSX" in item.parts:
                          continue
                      with item.open("rb") as f:
                          sig = f.read(8)
                      if any(sig.startswith(m) for m in archive_signatures):
                          extract_and_add(item, label)
                          found_any = True
                      elif item.suffix.lower() in package_extensions:
                          add_package(item, label)
                          found_any = True
                      else:
                          ext = detect_package_extension(item)
                          if ext:
                              renamed = item.with_name(f"{item.name}{ext}")
                              item.rename(renamed)
                              add_package(renamed, label)
                              found_any = True
                  shutil.rmtree(source, ignore_errors=True)
                  if not found_any:
                      raise SystemExit(
                          f"No NSP/XCI/NSZ/XCZ/NUP packages found in {label} download."
                      )
                  return

              with source.open("rb") as f:
                  signature = f.read(8)

              is_archive = any(
                  signature.startswith(magic)
                  for magic in archive_signatures
              )

              if is_archive:
                  extract_and_add(source, label)
              else:
                  print(
                      f"{label}: not an archive; "
                      "checking as a direct package."
                  )

                  extension = detect_package_extension(source)
                  if not extension:
                      raise SystemExit(
                          f"{label} is not a recognized RAR/ZIP/7Z archive "
                          "or direct NSP/XCI/NSZ/XCZ/NUP package."
                      )

                  target = game_dir / f"{label}{extension}"

                  if target.exists():
                      raise SystemExit(
                          f"Output package already exists: {target.name}"
                      )

                  shutil.move(str(source), str(target))
                  validate_package(target)

                  print(
                      f"Added direct package: {target.name} "
                      f"({target.stat().st_size:,} bytes)"
                  )

          process_download("game")
          process_download("update")
          process_download("dlc")

          # Decompress any .nsz or .xcz packages to .nsp / .xci so both
          # standard and BC-fallback builds work seamlessly with NSZ/XCZ.
          compressed = sorted(
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in (".nsz", ".xcz")
          )
          if compressed:
              nsz_tmp = work / "nsz_tmp"
              nsz_tmp.mkdir(parents=True, exist_ok=True)
              keys_link = nsz_tmp / "keys.txt"
              if not keys_link.exists():
                  keys_link.symlink_to(keys_path.resolve())
              for pkg in compressed:
                  out_ext = ".nsp" if pkg.suffix.lower() == ".nsz" else ".xci"
                  print(f"Decompressing {pkg.name} -> {pkg.stem}{out_ext} ...")
                  subprocess.run(
                      [
                          sys.executable,
                          "-c",
                          "import sys; sys.argv[0]='nsz'; from nsz import main; main()",
                          "-D",
                          "-o",
                          str(game_dir),
                          str(pkg.resolve()),
                      ],
                      cwd=str(nsz_tmp),
                      check=True,
                  )
                  pkg.unlink()

          # Ensure every prepared NSP/XCI package has either a .tik inside or a
          # [TitleID] tag in its filename so ticketless (standard-crypto) NSPs
          # and XCIs work across both standard and BC-fallback nxnative versions.
          import re
          header_key_hex = None
          if keys_path.is_file():
              for line in keys_path.read_text(errors="replace").splitlines():
                  m = re.match(r"^\s*header_key\s*=\s*([0-9A-Fa-f]{64})\s*$", line)
                  if m:
                      header_key_hex = m.group(1)
                      break

          def probe_nca_title_id(pkg_path):
              if not header_key_hex:
                  return None
              try:
                  from nsz.nut import aes128
                  xts_key = bytes.fromhex(header_key_hex)
                  with pkg_path.open("rb") as f:
                      h = f.read(16)
                      if len(h) != 16 or h[:4] != b"PFS0":
                          return None
                      count, str_size = struct.unpack_from("<II", h, 4)
                      entries = f.read(count * 0x18)
                      strings = f.read(str_size)
                      data_base = 16 + count * 0x18 + str_size
                      meta_tids, other_tids = [], []
                      for i in range(count):
                          d_off, d_sz, s_off = struct.unpack_from("<QQI", entries, i * 0x18)
                          end = strings.find(b"\0", s_off)
                          name = strings[s_off:end].decode(errors="replace") if end >= 0 else ""
                          if not name.lower().endswith(".nca") or d_sz < 0x400:
                              continue
                          f.seek(data_base + d_off + 0x200)
                          sec1 = f.read(0x200)
                          if len(sec1) != 0x200:
                              continue
                          dec = aes128.AESXTS(xts_key, sector=1).decrypt(sec1)
                          if dec[:4] in (b"NCA3", b"NCA2"):
                              ctype = dec[0x05]
                              tid = struct.unpack_from("<Q", dec, 0x10)[0]
                              if ctype == 1:
                                  meta_tids.append(tid)
                              else:
                                  other_tids.append(tid)
                      if meta_tids:
                          return min(meta_tids)
                      if other_tids:
                          return min(other_tids)
              except Exception as exc:
                  print(f"Warning: NCA header title ID probe failed for {pkg_path.name}: {exc}")
              return None

          for pkg in sorted(game_dir.iterdir()):
              if not pkg.is_file() or pkg.suffix.lower() not in (".nsp", ".xci"):
                  continue
              has_tik = any(
                  re.fullmatch(r"[0-9A-Fa-f]{32}\.tik", n)
                  for n in pfs0_entries(pkg)
              )
              has_tag = bool(re.search(r"\[[0-9A-Fa-f]{16}\]", pkg.name))
              if not has_tik and not has_tag:
                  tid = probe_nca_title_id(pkg)
                  if tid is not None:
                      new_name = f"{pkg.stem} [{tid:016X}]{pkg.suffix}"
                      new_path = pkg.with_name(new_name)
                      pkg.rename(new_path)
                      print(f"Tagged ticketless package with NCA Title ID: {new_path.name}")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file()
              and p.suffix.lower() in package_extensions
          )

          if not packages:
              raise SystemExit("No game packages were prepared.")

          needs_keys = any(p.suffix.lower() in (".nsp", ".xci", ".nsz", ".xcz") for p in packages)
          if needs_keys and (not keys_path.is_file() or keys_path.stat().st_size == 0):
              raise SystemExit("prod.keys is required for NSP/XCI/NSZ/XCZ packages.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

      - name: Detect game title ID, IPA filename, and cool Handheld default
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
          DEVICE_INPUT: ${{ inputs.device }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          # Set Handheld mode (DM_OPMODE=0, 720p, lowest heat & battery drain) as the
          # unlocked default in the Start Screen & In-Game Menu without locking it via env.txt.
          # On NX2Apple builds, also expose Touch control size and Left stick position on the Start Screen.
          python - "$DEVICE_INPUT" <<'PY'
          import sys
          from pathlib import Path

          device = sys.argv[1]
          game_py = Path("dm/games/game.py")
          if game_py.is_file():
              txt = game_py.read_text(encoding="utf-8")
              txt = txt.replace(
                  "om = g.get('op_mode', 'console')",
                  "om = g.get('op_mode', 'handheld')",
              )
              game_py.write_text(txt, encoding="utf-8")

          settings_tsv = Path("dm/games/settings.tsv")
          if settings_tsv.is_file():
              txt = settings_tsv.read_text(encoding="utf-8")
              txt = txt.replace(
                  "DM_OPMODE\tchoice\t1=Docked,0=Handheld\tDM_GAME_OPMODE",
                  "DM_OPMODE\tchoice\t1=Docked,0=Handheld\t0|DM_GAME_OPMODE",
              )
              if "NX2Apple" in device and "DM_TOUCH_SIZE\t" not in txt:
                  if not txt.endswith("\n"):
                      txt += "\n"
                  txt += (
                      "DM_TOUCH_SIZE\tchoice\tsmall=Small,medium=Medium,large=Large\tmedium\tplatform:ios\tControls\tTouch control size\t\tlevel=basic\n"
                      "DM_TOUCH_STICK\tchoice\tcorner=Corner,higher=Higher,inward=Inward\tcorner\tplatform:ios\tControls\tLeft stick position\t\tlevel=basic\n"
                  )
              settings_tsv.write_text(txt, encoding="utf-8")
          PY

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz", ".nup"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              if path.suffix.lower() == ".nup":
                  try:
                      sys.path.insert(0, str(Path.cwd() / "scripts"))
                      import pack_nup
                      with pack_nup.Nup(path) as n:
                          app, _, _, _ = pack_nup.scan(n)
                          if app and (app & 0xFFF) == 0:
                              candidates.add(f"{app:016X}")
                  except Exception as exc:
                      print(f"Warning: pack_nup scan failed for {path.name}: {exc}", file=sys.stderr)

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if not candidates:
              try:
                  sys.path.insert(0, str(Path.cwd() / "scripts"))
                  import build_ipa_from_nsp as b
                  keys_path = Path(sys.argv[1]).parent / "nxnative" / "prod.keys"
                  keys = b.load_keys(keys_path) if keys_path.is_file() else {}
                  for path in root.iterdir():
                      if path.is_file() and path.suffix.lower() in {".nsp", ".xci"}:
                          tid = b.probe_nca_title_id(path, keys)
                          if tid:
                              val = int(tid, 16)
                              if (val & 0xFFF) == 0:
                                  candidates.add(f"{val:016X}")
              except Exception:
                  pass

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP/NUP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"

          if [[ -n "${PROFILE_OVERRIDE:-}" ]]; then
            PROFILE_ID="$(echo "$PROFILE_OVERRIDE" | tr '[:lower:]' '[:upper:]')"
            echo "Using manual profile override: $PROFILE_ID"
          elif [[ -d "dm/games/$DETECTED_ID" ]]; then
            PROFILE_ID="$DETECTED_ID"
            echo "Found matching profile directory: dm/games/$PROFILE_ID"
          else
            PROFILE_ID="DEFAULT"
            echo "No profile directory for $DETECTED_ID; falling back to DEFAULT."
          fi

          IPA_FILENAME="$(python - "$GAME_DIR" "$DETECTED_ID" <<'PY'
          import re
          import sys
          from pathlib import Path

          game_dir = Path(sys.argv[1])
          tid = sys.argv[2]

          def clean_ipa_name(raw):
              raw = re.sub(r"\[[^\]]*\]", "", raw)
              raw = re.sub(r"\([^\)]*\)", "", raw)
              cleaned = re.sub(r"[^A-Za-z0-9._-]+", "", raw.title().replace(" ", ""))
              cleaned = cleaned.strip("._-")
              if not cleaned:
                  return f"Game-{tid}.ipa"
              if not cleaned.lower().endswith(".ipa"):
                  cleaned += ".ipa"
              return cleaned

          tsv = Path(f"dm/games/{tid}/game.tsv")
          if tsv.is_file():
              for line in tsv.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.startswith("ipa\t"):
                      val = line.split("\t", 1)[1].strip()
                      if val:
                          print(clean_ipa_name(val[:-4] if val.lower().endswith(".ipa") else val))
                          raise SystemExit(0)
                  if line.startswith("name\t"):
                      val = line.split("\t", 1)[1].strip()
                      if val:
                          print(clean_ipa_name(val))
                          raise SystemExit(0)

          for p in sorted(game_dir.iterdir()):
              if p.is_file() and p.suffix.lower() in {".nsp", ".xci", ".nup"}:
                  if tid.lower() in p.name.lower() or p.suffix.lower() == ".nup":
                      print(clean_ipa_name(p.stem))
                      raise SystemExit(0)

          print(f"NxNative-{tid}.ipa")
          PY
          )"

          echo "Shader profile ID: $PROFILE_ID"
          echo "Output IPA filename: $IPA_FILENAME"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"
          echo "DETECTED_TITLE_ID=$DETECTED_ID" >> "$GITHUB_ENV"
          echo "IPA_FILENAME=$IPA_FILENAME" >> "$GITHUB_ENV"

      - name: Run fast 2-minute compatibility survey (Survey Only mode)
        if: inputs.build_mode == 'Survey Only (Fast 2-min compatibility check)'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          KEYS_ARGS=()
          if [[ -s "$WORK/prod.keys" ]]; then
            KEYS_ARGS=(-k "$WORK/prod.keys")
          fi

          SURVEY_ARGS=(--survey-only)
          if python scripts/build_ipa_from_nsp.py --help 2>&1 | grep -q -- "--provisional"; then
            SURVEY_ARGS+=(--provisional)
          fi

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            "${KEYS_ARGS[@]}" \
            "${SURVEY_ARGS[@]}"

          {
            echo "## 🔍 Compatibility Survey Report (\`$DETECTED_TITLE_ID\`)"
            if [[ -f "dm/games/$DETECTED_TITLE_ID/README.md" ]]; then
              echo "✅ **Official Profile Status:** Supported in \`dm/games/$DETECTED_TITLE_ID\`!"
              echo ""
              echo "<details><summary><b>View Official Profile Notes</b></summary>"
              echo ""
              cat "dm/games/$DETECTED_TITLE_ID/README.md"
              echo ""
              echo "</details>"
              echo ""
            else
              echo "ℹ️ **Official Profile Status:** No official profile yet (uses automatic provisional profile)."
              echo ""
            fi
            SURVEY_FILE="$(find "$GAME_DIR" -name "survey.md" -type f -print -quit)"
            if [[ -n "$SURVEY_FILE" && -f "$SURVEY_FILE" ]]; then
              cat "$SURVEY_FILE"
            else
              echo "_Survey completed (see job logs for details)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update shader toolchain lock and header
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        shell: bash
        run: |
          set -euo pipefail
          echo "Preparing shader toolchain for profile $DM_GAME"

          CHAIN_SCRIPT="$(
            find . -name dmsh_chain.py -type f -print -quit
          )"
          LOCK_SCRIPT="$(
            find . -name tool_lock.py -type f -print -quit
          )"

          if [[ -z "$CHAIN_SCRIPT" ]]; then
            echo "::error::Could not find dmsh_chain.py"
            exit 1
          fi

          if [[ -n "$LOCK_SCRIPT" ]]; then
            python "$LOCK_SCRIPT" --update-lock
          else
            python "$CHAIN_SCRIPT" --update-lock
          fi

          python "$CHAIN_SCRIPT" --header

          # Normalize dmsh_xlate_bin timestamps so shader cache keys stay identical across runners
          if [[ -d "dm/gfx/tools/dmsh_xlate_bin" ]]; then
            find dm/gfx/tools/dmsh_xlate_bin -exec touch -t 202601010000.00 {} +
          fi

          SHADER_HASH="$(python - <<'PY'
          import hashlib, os
          from pathlib import Path
          h = hashlib.sha256()
          for p in (Path("dm/gfx/nvn/dmsh_chain.h"), Path(f"dm/games/{os.environ.get('DETECTED_TITLE_ID', '')}/game.tsv")):
              if p.is_file():
                  h.update(p.read_bytes())
          print(h.hexdigest()[:12])
          PY
          )"
          echo "SHADER_CACHE_HASH=$SHADER_HASH" >> "$GITHUB_ENV"

      - name: Restore compiled iOS shader cache
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nxnative-shader-cache
          key: nxnative-shaders-${{ env.DETECTED_TITLE_ID }}-${{ contains(inputs.device, 'BC fallback') && 'bc' || 'std' }}-${{ env.SHADER_CACHE_HASH }}
          restore-keys: |
            nxnative-shaders-${{ env.DETECTED_TITLE_ID }}-${{ contains(inputs.device, 'BC fallback') && 'bc' || 'std' }}-
            nxnative-shaders-${{ env.DETECTED_TITLE_ID }}-

      - name: Build unsigned IPA
        if: inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        env:
          ROMFS_MODE_INPUT: ${{ inputs.romfs_mode }}
          LANG_INPUT: ${{ inputs.language }}
          SHOW_FPS_INPUT: ${{ inputs.show_fps }}
          DEVICE_INPUT: ${{ inputs.device }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          BUILD_DIR="$GAME_DIR/${DETECTED_TITLE_ID}_build"
          SHADER_CACHE="$RUNNER_TEMP/nxnative-shader-cache"

          if [[ -d "$SHADER_CACHE/shader" ]]; then
            echo "Restoring cached iOS shaders for $DETECTED_TITLE_ID..."
            mkdir -p "$BUILD_DIR"
            cp -a "$SHADER_CACHE/shader" "$BUILD_DIR/shader"
          fi

          HELP_TEXT="$(python scripts/build_ipa_from_nsp.py --help 2>&1 || true)"

          BUILD_ARGS=("$GAME_DIR" -o "$OUTPUT")
          if [[ -s "$WORK/prod.keys" ]]; then
            BUILD_ARGS+=(-k "$WORK/prod.keys")
          fi

          # Device-specific renderer & pipeline archive settings
          if [[ "$DEVICE_INPUT" == *"BC fallback"* ]]; then
            export DM_IOS_RENDERER=legacy
            export DM_LEGACY_TARGET=a10x
            if grep -q -- "--gpu" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--gpu none)
            fi
          elif grep -q -- "--gpu" <<<"$HELP_TEXT"; then
            # Pre-compile Metal 4 pipeline archive for A19 Pro (g18p) on iPhone 17 Pro builds
            BUILD_ARGS+=(--gpu g18p)
          fi

          # RomFS mode: bundle (full all-in-one IPA, delete extracted files after packing)
          # or separate (slim ~100 MB update IPA without RomFS)
          if [[ "$ROMFS_MODE_INPUT" == separate* ]]; then
            export DM_COPY_ROMFS=NO
            if grep -q -- "--romfs" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--romfs separate)
            fi
          else
            export DM_FULL_ROMFS=1
            export DM_COPY_ROMFS=YES
            if grep -q -- "--no-keep-extracted" <<<"$HELP_TEXT"; then
              BUILD_ARGS+=(--no-keep-extracted)
            fi
          fi

          # Optional default game language (unlocked in Start Screen)
          if [[ -n "${LANG_INPUT// /}" ]]; then
            BUILD_ARGS+=(-l "${LANG_INPUT// /}")
          fi

          # Default FPS counter toggle (unlocked in Start Screen)
          if [[ "$SHOW_FPS_INPUT" == "false" ]] && grep -q -- "--no-show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--no-show-fps)
          elif grep -q -- "--show-fps" <<<"$HELP_TEXT"; then
            BUILD_ARGS+=(--show-fps)
          fi

          python scripts/build_ipa_from_nsp.py "${BUILD_ARGS[@]}"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          if [[ -d "$BUILD_DIR/shader" ]]; then
            echo "Staging compiled iOS shaders for GitHub Actions cache..."
            rm -rf "$SHADER_CACHE"
            mkdir -p "$SHADER_CACHE/shader"
            for item in ios cache pso_pairs.tsv; do
              if [[ -e "$BUILD_DIR/shader/$item" ]]; then
                cp -a "$BUILD_DIR/shader/$item" "$SHADER_CACHE/shader/$item"
              fi
            done
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Publish direct IPA download link
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/$IPA_FILENAME"
          IPA_SIZE="$(ls -lh "$OUTPUT" | awk '{print $5}')"

          # Pick the fastest Asia-Pacific Gofile server (with automatic fallback to global upload.gofile.io)
          UPLOAD_ENDPOINT="$(python - <<'PY'
          import json, urllib.request
          for url in ("https://api.gofile.io/servers?zone=ap", "https://api.gofile.io/servers"):
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      servers = data.get("data", {}).get("servers", [])
                      if servers and servers[0].get("name"):
                          print(f"https://{servers[0]['name']}.gofile.io/uploadfile")
                          raise SystemExit(0)
              except Exception:
                  pass
          print("https://upload.gofile.io/uploadfile")
          PY
          )"
          echo "Using Gofile upload endpoint: $UPLOAD_ENDPOINT"

          echo "Uploading $IPA_FILENAME ($IPA_SIZE) to Gofile for direct iPhone download..."
          RESPONSE="$(curl -sS --retry 3 -F "file=@$OUTPUT" "$UPLOAD_ENDPOINT" || curl -sS --retry 3 -F "file=@$OUTPUT" https://upload.gofile.io/uploadfile)"

          DOWNLOAD_URL="$(python - "$RESPONSE" <<'PY'
          import json, sys
          try:
              data = json.loads(sys.argv[1])
              if data.get("status") == "ok":
                  print(data["data"]["downloadPage"])
          except Exception:
              pass
          PY
          )"

          if [[ -n "$DOWNLOAD_URL" ]]; then
            echo "=========================================="
            echo "DIRECT IPA DOWNLOAD LINK ($IPA_FILENAME - $IPA_SIZE): $DOWNLOAD_URL"
            echo "=========================================="
            {
              echo "## 📱 Direct iPhone Download Link (Asia-Pacific Optimized)"
              echo "- **Game:** \`$IPA_FILENAME\` (\`$DETECTED_TITLE_ID\`)"
              echo "- **Engine:** \`${{ inputs.device }}\`"
              echo "- **Default Console Mode:** \`Handheld (Cool 720p mode)\` — unlocked in Start Screen & In-Game Menu"
              echo "- **📦 [Tap here to download $IPA_FILENAME ($IPA_SIZE) directly]($DOWNLOAD_URL)**"
              echo ""
              echo "_Tip: Open the link above on your iPhone to download directly without needing to unzip a GitHub artifact._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not generate Gofile link; use the GitHub Artifact below instead."
          fi

      - name: Upload IPA
        if: success() && inputs.build_mode != 'Survey Only (Fast 2-min compatibility check)'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ runner.temp }}/${{ env.IPA_FILENAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
            ${{ runner.temp }}/GameFiles/*_survey/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/nxnative" \
            "$RUNNER_TEMP/GameFiles"
