          // This does not place the game cursor at an absolute coordinate.
          - (void)trackBegin:(NSSet<UITouch *> *)touches {
              if (_trackFinger) return;
              for (UITouch *t in touches) {
                  if (t.type != UITouchTypeDirect) continue;
                  _trackFinger = t; _trackStart = _trackLast = [t locationInView:self];
