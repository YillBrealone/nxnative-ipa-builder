                  @[@"16:9", @"16:9 (Default Widescreen)"],
                  @[@"fill", @"Fill Screen (Full iPad Display)"],
                  @[@"16:10", @"16:10 (Widescreen)"],
                  @[@"4:3", @"4:3 (Retro / Classic)"],
                  @[@"21:9", @"21:9 (Ultrawide)"]
              ];
