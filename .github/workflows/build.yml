          - (UIMenuElement *)menuRowForEnv:(NSString *)env label:(NSString *)label kind:(NSString *)kind def:(NSString *)def options:(NSArray<NSArray<NSString *> *> *)options onVal:(NSString *)onVal offVal:(NSString *)offVal {
              NSString *now = [self currentSettingValue:env def:def];
              if ([kind isEqualToString:@"toggle"]) {
                  NSString *onV = onVal.length ? onVal : @"1", *offV = offVal.length ? offVal : @"0";
                  BOOL isOn = [now isEqualToString:onV];
                  UIAction *act = [UIAction actionWithTitle:label image:nil identifier:nil handler:^(__kindof UIAction *a) {
                      (void)a;
                      dm_apply_setting_live(env.UTF8String, (isOn ? offV : onV).UTF8String);
                  }];
                  act.state = isOn ? UIMenuElementStateOn : UIMenuElementStateOff;
                  return act;
              }
              NSMutableArray<UIAction *> *acts = [NSMutableArray array];
              NSString *curTitle = now;
              for (NSArray<NSString *> *opt in options) {
                  if (opt.count < 2) continue;
                  NSString *v = opt[0], *t = opt[1];
                  BOOL sel = [v isEqualToString:now] || (v.doubleValue > 0 && fabs(v.doubleValue - now.doubleValue) < 1e-4);
                  if (sel) curTitle = t;
                  UIAction *act = [UIAction actionWithTitle:t image:nil identifier:nil handler:^(__kindof UIAction *a) {
