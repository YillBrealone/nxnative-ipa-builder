          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz", ".nup"}

          def pfs0_names(path):
              try:
                  with path.open("rb") as f:
                      header = f.read(16)

                      if len(header) != 16 or header[:4] != b"PFS0":
                          return []

                      count, string_size = struct.unpack_from(
                          "<II", header, 4
                      )

                      if count > 100000 or string_size > 100000000:
                          return []

                      entries = f.read(count * 0x18)
                      strings = f.read(string_size)

                      if len(entries) != count * 0x18:
                          return []

                      names = []

                      for i in range(count):
                          offset = struct.unpack_from(
                              "<I", entries, i * 0x18 + 0x10
                          )[0]

                          if offset >= len(strings):
                              continue

                          end = strings.find(b"\0", offset)

                          if end < 0:
                              continue

                          names.append(
                              strings[offset:end].decode(
                                  errors="replace"
                              )
                          )

                      return names

              except (OSError, struct.error):
                  return []

          candidates = set()

          for path in root.iterdir():
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue

              if path.suffix.lower() == ".nup":
                  try:
                      sys.path.insert(0, str(Path.cwd() / "scripts"))
                      import pack_nup
                      with pack_nup.Nup(path) as n:
                          app, _, _, _ = pack_nup.scan(n)
                          if app and (app & 0xFFF) == 0:
                              candidates.add(f"{app:016X}")
                  except Exception as exc:
                      print(f"Warning: pack_nup scan failed for {path.name}: {exc}", file=sys.stderr)

              for name in pfs0_names(path):
                  match = re.fullmatch(
                      r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik",
                      name,
                  )

                  if match:
                      title_id = int(match.group(1), 16)

                      if (title_id & 0xFFF) == 0:
                          candidates.add(f"{title_id:016X}")

              match = re.search(
                  r"\[([0-9A-Fa-f]{16})\]",
                  path.name,
              )

              if match:
                  title_id = int(match.group(1), 16)

                  if (title_id & 0xFFF) == 0:
                      candidates.add(f"{title_id:016X}")

          if not candidates:
              try:
                  sys.path.insert(0, str(Path.cwd() / "scripts"))
                  import build_ipa_from_nsp as b
                  keys_path = Path(sys.argv[1]).parent / "nxnative" / "prod.keys"
                  keys = b.load_keys(keys_path) if keys_path.is_file() else {}
                  for path in root.iterdir():
                      if path.is_file() and path.suffix.lower() in {".nsp", ".xci"}:
                          tid = b.probe_nca_title_id(path, keys)
                          if tid:
                              val = int(tid, 16)
                              if (val & 0xFFF) == 0:
                                  candidates.add(f"{val:016X}")
              except Exception:
                  pass

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}. "
                  "Check the base NSP/NUP and its ticket/filename."
              )

          print(next(iter(candidates)))
          PY
          )"

          echo "Detected base title ID: $DETECTED_ID"

          if [[ -n "${PROFILE_OVERRIDE:-}" ]]; then
            PROFILE_ID="$(echo "$PROFILE_OVERRIDE" | tr '[:lower:]' '[:upper:]')"
            echo "Using manual profile override: $PROFILE_ID"
          elif [[ -d "dm/games/$DETECTED_ID" ]]; then
