              NSMutableArray<UIMenuElement *> *menus = [NSMutableArray array];
              [menus addObject:layoutInline];
              if (gameRows.count) [menus addObject:[UIMenu menuWithTitle:@"Game Settings" image:nil identifier:nil options:UIMenuOptionsDisplayInline children:gameRows]];
              if (ctrlRows.count) [menus addObject:[UIMenu menuWithTitle:@"Controls" image:nil identifier:nil options:UIMenuOptionsDisplayInline children:ctrlRows]];
              if (perfRows.count) [menus addObject:[UIMenu menuWithTitle:@"Performance" image:nil identifier:nil options:UIMenuOptionsDisplayInline children:perfRows]];

              UIAction *openSheet = [UIAction actionWithTitle:@"Start Menu & Cloud Saves…" image:[UIImage systemImageNamed:@"slider.horizontal.3"] identifier:nil handler:^(__kindof UIAction *a) {
                  (void)a; dm_open_settings_sheet();
              }];
              [menus addObject:[UIMenu menuWithTitle:@"" image:nil identifier:nil options:UIMenuOptionsDisplayInline children:@[openSheet]]];
              return menus;
          }
