              NSMutableArray<UIMenuElement *> *perfRows = [NSMutableArray array];
              NSMutableArray<UIMenuElement *> *otherRows = [NSMutableArray array];
              NSSet<NSString *> *displayKeys = [NSSet setWithArray:@[@"DM_ASPECT_MODE", @"DM_RENDER_SCALE", @"DM_DYNAMIC_RESOLUTION", @"DM_PRESENT_UPSCALE", @"DM_UPSCALER", @"DM_PICTURE_FIT", @"DM_SCREEN_ASPECT", @"DM_FULLSCREEN"]];
