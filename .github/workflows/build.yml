                  UIAction *act = [UIAction actionWithTitle:menuLabel image:nil identifier:nil handler:^(__kindof UIAction *a) {
                      (void)a;
                      dm_apply_setting_live(env.UTF8String, (isOn ? offV : onV).UTF8String);
