              NSMutableArray<UIMenuElement *> *gameRows = [NSMutableArray arrayWithObject:aspectMenu];
              NSMutableArray<UIMenuElement *> *ctrlRows = [NSMutableArray array];
              NSMutableArray<UIMenuElement *> *perfRows = [NSMutableArray array];
              NSMutableSet<NSString *> *seen = [NSMutableSet setWithObject:@"DM_ASPECT_MODE"];

              NSURL *jsonURL = [NSBundle.mainBundle.resourceURL URLByAppendingPathComponent:@"dm/launcher.json"];
              NSData *data = jsonURL ? [NSData dataWithContentsOfURL:jsonURL] : nil;
              NSDictionary *json = data ? [NSJSONSerialization JSONObjectWithData:data options:0 error:nil] : nil;
              NSArray *settings = [json[@"settings"] isKindOfClass:NSArray.class] ? json[@"settings"] : @[];

              for (NSDictionary *s in settings) {
                  if (![s isKindOfClass:NSDictionary.class]) continue;
                  NSString *env = s[@"env"], *kind = s[@"kind"], *label = s[@"label"], *def = s[@"default"] ?: @"";
                  NSString *sec = s[@"section"] ?: @"Game";
                  if (!env.length || !kind.length || !label.length || [seen containsObject:env]) continue;
                  [seen addObject:env];
                  UIMenuElement *el = nil;
                  if ([kind isEqualToString:@"toggle"]) {
                      NSString *onV = s[@"on"] ?: @"1", *offV = s[@"off"] ?: @"0";
                      el = [self menuRowForEnv:env label:label kind:@"toggle" def:def options:nil onVal:onV offVal:offV];
                  } else if ([kind isEqualToString:@"choice"]) {
                      NSArray *opts = [s[@"options"] isKindOfClass:NSArray.class] ? s[@"options"] : @[];
                      el = [self menuRowForEnv:env label:label kind:@"choice" def:def options:opts onVal:nil offVal:nil];
                  } else if ([kind isEqualToString:@"range"]) {
                      double lo = [s[@"min"] doubleValue], hi = [s[@"max"] doubleValue], st = [s[@"step"] doubleValue];
                      if (st <= 0) st = 0.1;
                      NSMutableArray<NSArray<NSString *> *> *rOpts = [NSMutableArray array];
                      for (double v = lo; v <= hi + 1e-6; v += st) {
                          int pct = (int)llround(v * 100.0);
                          if ([env isEqualToString:@"DM_RENDER_SCALE"] && (pct % 10 != 0 && pct != 75)) continue;
                          if ([env isEqualToString:@"DM_RUMBLE_GAIN"] && (pct % 50 != 0)) continue;
                          [rOpts addObject:@[[NSString stringWithFormat:@"%g", v], [NSString stringWithFormat:@"%d%%", pct]]];
                      }
                      el = [self menuRowForEnv:env label:label kind:@"choice" def:def options:rOpts onVal:nil offVal:nil];
                  }
                  if (!el) continue;
                  if ([sec isEqualToString:@"Controls"]) [ctrlRows addObject:el];
                  else if ([sec isEqualToString:@"Performance"]) [perfRows addObject:el];
                  else [gameRows addObject:el];
